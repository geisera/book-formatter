name: Foundation checks
on: [push, pull_request]
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/pdf-proof-requirements.txt
      - run: npm run proof:pdf
      - run: python scripts/inspect-print.py
      - uses: actions/upload-artifact@v5
        with:
          name: print-validation-proofs
          path: artifacts/print/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install verified EPUBCheck 5.4.0
        run: |
          mkdir -p .epubcheck
          curl --fail --silent --show-error --location https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip --output .epubcheck/release.zip
          echo "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  .epubcheck/release.zip" | sha256sum --check -
          unzip -q .epubcheck/release.zip -d .epubcheck
      - run: npm run check:epub
        env:
          EPUBCHECK_JAR: ${{ github.workspace }}/.epubcheck/epubcheck-5.4.0/epubcheck.jar
      - uses: actions/upload-artifact@v5
        with:
          name: epub-validation-proofs
          path: artifacts/epub/
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
